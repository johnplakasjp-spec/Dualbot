name: smart-bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python bot.py
      - name: Save balance
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add balance.json
          git commit -m "update balance" || echo "no change"
          git push
